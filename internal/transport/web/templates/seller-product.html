{{define "seller-product"}}
<!doctype html>
<html lang="en">
<head><title>{{.Title}}</title>{{template "head" .}}</head>
<body class="bg-paper text-ink">
  {{template "header" .}}
  <main class="mx-auto max-w-3xl px-5 py-12 lg:px-10 lg:py-16"><a class="text-sm font-semibold text-indigo/70" href="/seller">← Seller workspace</a><h1 class="mt-5 font-display text-5xl text-indigo">Create a product draft</h1><p class="mt-4 text-sm leading-6 text-ink/65">Every field becomes catalogue data. Nothing is invented for the customer.</p><form class="mt-10 grid gap-5 rounded-2xl border border-line bg-white p-6 sm:grid-cols-2 sm:p-8" method="post" action="/seller/products"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><label class="grid gap-2 text-sm font-semibold" for="name">Product name<input class="field" id="name" name="name" required></label><label class="grid gap-2 text-sm font-semibold" for="slug">URL slug<input class="field" id="slug" name="slug" placeholder="handmade-soap" required></label><label class="grid gap-2 text-sm font-semibold" for="brand_name">Brand/maker name<input class="field" id="brand_name" name="brand_name" required></label><label class="grid gap-2 text-sm font-semibold" for="brand_slug">Brand slug<input class="field" id="brand_slug" name="brand_slug" placeholder="my-studio" required></label><label class="grid gap-2 text-sm font-semibold" for="category_name">Category name<input class="field" id="category_name" name="category_name" required></label><label class="grid gap-2 text-sm font-semibold" for="category_slug">Category slug<input class="field" id="category_slug" name="category_slug" placeholder="natural-care" required></label><label class="grid gap-2 text-sm font-semibold" for="sku">SKU<input class="field" id="sku" name="sku" required></label><label class="grid gap-2 text-sm font-semibold" for="price_cents">Price in paise<input class="field" id="price_cents" name="price_cents" type="number" min="1" required></label><label class="grid gap-2 text-sm font-semibold" for="initial_stock">Initial stock<input class="field" id="initial_stock" name="initial_stock" type="number" min="0" max="100000" required></label><label class="grid gap-2 text-sm font-semibold sm:col-span-2" for="delivery_label">Delivery label<input class="field" id="delivery_label" name="delivery_label" value="Dispatch details at checkout"></label><label class="grid gap-2 text-sm font-semibold sm:col-span-2" for="description">Description<textarea class="field min-h-32" id="description" name="description" required></textarea></label><button class="button-primary sm:col-span-2" type="submit">Save draft</button></form></main>
  {{template "footer" .}}
</body>
</html>
{{end}}
