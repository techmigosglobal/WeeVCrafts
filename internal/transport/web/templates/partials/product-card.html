{{define "product-card"}}
<article class="group">
  <a href="/products/{{.Slug}}" class="block" aria-label="View {{.Name}}">
    <div class="product-card__media">
      {{if .ImageURL}}<img src="{{.ImageURL}}" alt="{{.Name}}" loading="lazy" class="h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]">{{else}}<span class="text-sm text-ink/45">Image coming from the catalogue</span>{{end}}
    </div>
    <div class="mt-4 flex items-start justify-between gap-4"><div><p class="text-xs font-semibold uppercase tracking-[0.12em] text-ink/50">{{.Brand}}</p><h3 class="mt-2 text-lg font-semibold leading-tight text-indigo">{{.Name}}</h3></div><span class="text-base font-semibold text-indigo">{{money .PriceCents}}</span></div>
    <div class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-2 text-xs text-ink/60"><span>★ {{rating .Rating}} ({{.ReviewCount}})</span><span>{{.DeliveryLabel}}</span></div>
    {{if .Swatches}}<div class="mt-4 flex gap-2" aria-label="Available colours">{{range .Swatches}}<span class="swatch" style="background-color: {{.}}"></span>{{end}}</div>{{end}}
  </a>
</article>
{{end}}
