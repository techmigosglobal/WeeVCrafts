# Production Netlify adapter for the real Go/PostgreSQL marketplace backend.
# Runtime state lives in Netlify PostgreSQL; function memory and the static
# publish directory are never data stores. VPS deployments use Redis and S3.

[build]
  base = "."
  command = "./scripts/build-netlify-function.sh"
  functions = "netlify/functions-dist"
  publish = "netlify/site"

[build.environment]
  GO_VERSION = "1.26"
  GO_IMPORT_PATH = "github.com/wecratfs/commerce"

# Reconcile the product-search outbox, expired inventory reservations, and
# abandoned product-media uploads in bounded batches. No resident worker runs.
[functions."maintenance"]
  schedule = "*/5 * * * *"

# Public pages, assets, and API endpoints are server-rendered by the Go app.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/web"
  status = 200
  force = true
